name: Bootstrap Meowto Ranger from verified v0.7 source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import the previous game workflow into the new modular app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/itonkungx-x/Auto-Crate/41ea8633eefcf2c025f09c94c20441b8cf6d7067/.github/workflows/rangers-friend-auto-v05-build.yml' \
            --output /tmp/verified-v07.yml
          python3 - <<'PY'
          import base64, io, lzma, re, shutil, subprocess, tarfile
          from pathlib import Path
          src = Path('/tmp/verified-v07.yml').read_text(encoding='utf-8')
          def archive_after(marker, end):
              if marker not in src:
                  raise RuntimeError(f"Archive marker missing: {marker}")
              block = src.split(marker, 1)[1].split(end, 1)[0]
              encoded = ''.join(line.strip() for line in block.splitlines())
              return base64.b64decode(encoded, validate=True)
          base = archive_after("cat > /tmp/rangers-v05.b64 <<'PROJECT_ARCHIVE'", "PROJECT_ARCHIVE")
          project = Path('/tmp/meowto-original')
          project.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base)), mode='r:') as tf:
              tf.extractall(project, filter='data')
          for release in ('v06', 'v07'):
              name = f"cat > /tmp/{release}.patch.xz.b64 <<'PATCH_DATA'"
              raw = archive_after(name, "PATCH_DATA")
              patch = lzma.decompress(raw)
              subprocess.run(['patch', '--batch', '-p0', '--fuzz=0'],
                             input=patch, cwd=project, check=True)
          assert 'versionName = "0.7.0"' in (project/'app/build.gradle.kts').read_text()
          for name in ('app', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties'):
              item = project / name
              target = Path(name)
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copyfile(item, target)
          kotlin_old = Path('app/src/main/java/com/itonkung/rangersfriendauto')
          kotlin_new = Path('app/src/main/java/com/itonkung/meowtoranger')
          kotlin_new.mkdir(parents=True, exist_ok=True)
          for file in kotlin_old.rglob('*.kt'):
              body = file.read_text(encoding='utf-8').replace('com.itonkung.rangersfriendauto',
                                                                  'com.itonkung.meowtoranger')
              (kotlin_new / file.name).write_text(body, encoding='utf-8')
          shutil.rmtree(kotlin_old)
          gradle = Path('app/build.gradle.kts')
          code = gradle.read_text()
          code = code.replace('com.itonkung.rangersfriendauto', 'com.itonkung.meowtoranger')
          code = code.replace('versionCode = 7', 'versionCode = 8')
          code = code.replace('versionName = "0.7.0"', 'versionName = "0.8.0"')
          code = code.replace('dependencies {', 'dependencies {\n    implementation("androidx.core:core:1.15.0")')
          gradle.write_text(code)
          setting = Path('settings.gradle.kts')
          setting.write_text(setting.read_text().replace('RangersFriendAuto', 'MeowtoRanger'))
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text().replace('android:label="Rangers Friend Auto"',
                                              'android:label="Meowto Ranger"')
          xml = xml.replace('    <queries>', '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <queries>''')
          xml = xml.replace('    </application>', '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/update_paths" />
                  </provider>
              </application>''')
          manifest.write_text(xml)
          paths = Path('app/src/main/res/xml/update_paths.xml')
          paths.write_text('<?xml version="1.0" encoding="utf-8"?>\n'
                           '<paths xmlns:android="http://schemas.android.com/apk/res/android">\n'
                           '  <cache-path name="updates" path="updates/" />\n'
                           '</paths>\n')
          strings = Path('app/src/main/res/values/strings.xml')
          strings.write_text(strings.read_text().replace('Rangers Friend Auto', 'Meowto Ranger'))
          main = kotlin_new / 'MainActivity.kt'
          code = main.read_text()
          code = code.replace('import android.accessibilityservice.AccessibilityServiceInfo',
                        'import com.itonkung.meowtoranger.core.update.AppUpdater\n'
                        'import com.itonkung.meowtoranger.core.config.RemoteConfig\n'
                        'import com.itonkung.meowtoranger.modules.ModuleRegistry\n'
                        'import android.accessibilityservice.AccessibilityServiceInfo')
          code = code.replace('        buildScreen()', '        buildScreen()\n        RemoteConfig(this).refreshInBackground()')
          code = code.replace('text("RANGERS", 23f', 'text("MEOWTO", 23f')
          code = code.replace('text("FRIEND AUTO", 18f', 'text("RANGER", 18f')
          code = code.replace('        content.addView(head)', '''
                  content.addView(head)
                  content.addView(text("AUTOMATION MODULES", 11f, muted, true), margin(16, 8))
                  ModuleRegistry.modules.forEach { module ->
                      content.addView(text(module.title + "  ·  " + module.subtitle, 13f, white),
                          margin(0, 7))
                  }''')
          code = code.replace('        content.addView(text("กด ▶ ในเกม', '''
                  content.addView(button("ตรวจสอบอัปเดต", false) {
                      AppUpdater(this).checkForUpdates()
                  }, margin(10, 5))
                  content.addView(text("กด ▶ ในเกม''')
          main.write_text(code)
          service = kotlin_new / 'FriendAccessibilityService.kt'
          service_code = service.read_text()
          names = {
              'FRIEND_SWIPE_DURATION_MS': ('remote_swipe_duration_ms', '720L'),
              'FRIEND_SWIPE_REST_MS': ('remote_swipe_rest_ms', '850L'),
              'FRIEND_STABILITY_PROBE_MS': ('remote_stability_probe_ms', '410L'),
              'FRIEND_STABILITY_TIMEOUT_MS': ('remote_settle_timeout_ms', '3200L')
          }
          for const, (key, default) in names.items():
              service_code = re.sub(r'^\s*private const val '+const+r' = \d+L\s*$', '',
                                    service_code, flags=re.M)
              service_code = service_code.replace(const, f'prefs.getLong("{key}", {default})')
          service.write_text(service_code)
          Path('.gitignore').write_text('**/.gradle/\n**/build/\nlocal.properties\n*.keystore\n*.jks\n*.apk\n')
          print("Imported Kotlin game workflow, Meowto Ranger UI, update and config hooks")
          PY
      - name: Commit imported source files to the Meowto Ranger repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ build.gradle.kts settings.gradle.kts gradle.properties .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import Meowto Ranger v0.8 Android app and modular updater'
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build preview APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meowto-Ranger-v0.8-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
