name: Release signed Meowto Ranger APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing credentials from GitHub secrets
        shell: bash
        env:
          MEOWTO_KEYSTORE_BASE64: ${{ secrets.MEOWTO_KEYSTORE_BASE64 }}
          MEOWTO_STORE_PASSWORD: ${{ secrets.MEOWTO_STORE_PASSWORD }}
          MEOWTO_KEY_ALIAS: ${{ secrets.MEOWTO_KEY_ALIAS }}
          MEOWTO_KEY_PASSWORD: ${{ secrets.MEOWTO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MEOWTO_KEYSTORE_BASE64" || { echo "::error::Configure MEOWTO_KEYSTORE_BASE64 before creating a release"; exit 1; }
          test -n "$MEOWTO_STORE_PASSWORD"
          test -n "$MEOWTO_KEY_ALIAS"
          test -n "$MEOWTO_KEY_PASSWORD"
          printf '%s' "$MEOWTO_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          test -s release-keystore.jks
          chmod 600 release-keystore.jks
      - name: Build stable signed release
        env:
          MEOWTO_STORE_PASSWORD: ${{ secrets.MEOWTO_STORE_PASSWORD }}
          MEOWTO_KEY_ALIAS: ${{ secrets.MEOWTO_KEY_ALIAS }}
          MEOWTO_KEY_PASSWORD: ${{ secrets.MEOWTO_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Package APK and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Meowto-Ranger-$GITHUB_REF_NAME.apk"
          cd dist
          sha256sum "Meowto-Ranger-$GITHUB_REF_NAME.apk" > "Meowto-Ranger-$GITHUB_REF_NAME.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Meowto Ranger $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: Meowto-Ranger-Signed-Release
          path: dist/*
          if-no-files-found: error
